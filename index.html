<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Canvas Kalp · Ultra Hafif Patlama</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,700;14..32,900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #070510;
            --neon-pink: #ff2d8b;
            --neon-purple: #b44eff;
            --neon-blue: #4facfe;
            --font: 'Inter', sans-serif;
            --heart-size: clamp(380px, 65vw, 650px);
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 30% 35%, #1b1430, var(--bg-deep) 80%);
            font-family: var(--font);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* ===== ARKA PLAN ===== */
        .stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.7) 0%, transparent 70%);
            animation: twinkle var(--duration, 7s) ease-in-out infinite alternate;
            width: var(--size, 2.5px);
            height: var(--size, 2.5px);
            box-shadow: 0 0 10px 0 rgba(255, 255, 255, 0.05);
        }

        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1.4); }
        }

        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.12;
            animation: orbDrift 25s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-orb--1 {
            width: 500px;
            height: 500px;
            background: var(--neon-purple);
            top: -10%;
            left: -8%;
            animation-delay: 0s;
        }

        .ambient-orb--2 {
            width: 600px;
            height: 600px;
            background: var(--neon-pink);
            bottom: -15%;
            right: -12%;
            animation-delay: -8s;
        }

        .ambient-orb--3 {
            width: 400px;
            height: 400px;
            background: var(--neon-blue);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -16s;
            opacity: 0.06;
        }

        @keyframes orbDrift {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(70px, -50px) scale(1.15); }
            66% { transform: translate(-40px, 60px) scale(0.85); }
            100% { transform: translate(50px, -40px) scale(1.08); }
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(7, 5, 16, 0.93);
            backdrop-filter: blur(26px) saturate(170%);
            -webkit-backdrop-filter: blur(26px) saturate(170%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 2rem;
            transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            will-change: transform, opacity;
        }

        .modal-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.92);
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(32px) saturate(180%);
            -webkit-backdrop-filter: blur(32px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 32px;
            padding: clamp(2.5rem, 6vw, 4.5rem);
            max-width: 540px;
            width: 100%;
            text-align: center;
            box-shadow: 0 60px 140px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 45, 139, 0.04);
            animation: modalIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalIn {
            0% { opacity: 0; transform: scale(0.88) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-box h2 {
            font-size: clamp(2rem, 4.5vw, 3rem);
            font-weight: 700;
            background: linear-gradient(135deg, #ff2d8b, #b44eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.3rem;
        }

        .modal-box p {
            color: rgba(255, 255, 255, 0.35);
            font-weight: 300;
            font-size: clamp(0.9rem, 1.2vw, 1.05rem);
            margin-bottom: 2.2rem;
        }

        .modal-input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.8rem;
        }

        .modal-input-group input {
            width: 100px;
            height: 100px;
            text-align: center;
            font-size: 3.8rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid rgba(255, 45, 139, 0.12);
            border-radius: 28px;
            color: #fff;
            font-family: var(--font);
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
            text-transform: uppercase;
        }

        .modal-input-group input:focus {
            border-color: #ff2d8b;
            box-shadow: 0 0 50px rgba(255, 45, 139, 0.1);
        }

        .modal-input-group input::placeholder {
            color: rgba(255, 255, 255, 0.06);
            font-size: 1.3rem;
        }

        .btn-neon-modal {
            padding: 1rem 3.2rem;
            border: none;
            border-radius: 60px;
            font-family: var(--font);
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            background: linear-gradient(135deg, #ff2d8b, #b44eff);
            color: #fff;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 50px rgba(255, 45, 139, 0.08);
            width: 100%;
            max-width: 240px;
        }

        .btn-neon-modal:hover {
            transform: scale(1.04);
            box-shadow: 0 0 70px rgba(255, 45, 139, 0.2);
        }

        .btn-neon-modal:active {
            transform: scale(0.94);
        }

        /* ===== ANA İÇERİK ===== */
        .main-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            opacity: 0;
            transform: scale(0.7);
            transition: opacity 1s cubic-bezier(0.68, -0.55, 0.27, 1.55), transform 1s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            width: 100%;
            max-width: 800px;
            padding: 1rem;
        }

        .main-content.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* ===== CANVAS KALP ===== */
        .heart-wrapper {
            position: relative;
            width: var(--heart-size);
            height: var(--heart-size);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #heartCanvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
            filter: drop-shadow(0 0 80px rgba(255, 45, 139, 0.08));
        }

        /* ===== HARF ===== */
        .heart-letter {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -52%) scale(0.4);
            font-size: clamp(6rem, 18vw, 14rem);
            font-weight: 900;
            color: #fff;
            text-shadow:
                0 0 40px rgba(255, 45, 139, 0.9),
                0 0 100px rgba(255, 45, 139, 0.4),
                0 0 200px rgba(180, 78, 255, 0.25);
            letter-spacing: 0.02em;
            pointer-events: none;
            z-index: 5;
            text-transform: uppercase;
            line-height: 1;
            font-family: var(--font);
            opacity: 0;
            animation: letterPop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 3.8s forwards;
        }

        @keyframes letterPop {
            0% { opacity: 0; transform: translate(-50%, -52%) scale(0.4); }
            60% { opacity: 1; transform: translate(-50%, -52%) scale(1.1); }
            100% { opacity: 1; transform: translate(-50%, -52%) scale(1); }
        }

        /* ===== KALP ATIŞI ===== */
        .heart-wrapper.beating {
            animation: heartbeat 1.2s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.07); }
            28% { transform: scale(1); }
            42% { transform: scale(1.04); }
            56% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        /* ===== KONFETTİ - ULTRA HAFIF ===== */
        .confetti-container {
            position: fixed;
            inset: 0;
            z-index: 100;
            pointer-events: none;
            overflow: hidden;
        }

        .confetti-piece {
            position: absolute;
            opacity: 0;
            transform: translate(0, 0) scale(0) rotate(0deg);
            animation: confettiFly var(--duration, 1.8s) cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            will-change: transform, opacity;
            font-size: clamp(14px, 2.5vw, 32px);
            line-height: 1;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 5px rgba(255, 45, 139, 0.03));
            pointer-events: none;
            font-weight: 700;
            backface-visibility: hidden;
            -webkit-font-smoothing: antialiased;
        }

        @keyframes confettiFly {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(0) rotate(0deg);
            }
            20% {
                opacity: 0.9;
                transform: translate(var(--tx1, 0px), var(--ty1, -60px)) scale(1.0) rotate(var(--r1, 20deg));
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx2, 0px), var(--ty2, -350px)) scale(0.1) rotate(var(--r2, 300deg));
            }
        }

        /* ===== UÇAN KALPLER ===== */
        .floating-hearts {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .float-heart {
            position: absolute;
            font-size: clamp(16px, 2.2vw, 32px);
            opacity: 0;
            animation: floatHeart var(--duration, 14s) ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(255, 45, 139, 0.03));
            will-change: transform, opacity;
            backface-visibility: hidden;
        }

        @keyframes floatHeart {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0.3) rotate(0deg);
            }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% {
                opacity: 0;
                transform: translateY(-20vh) scale(1.0) rotate(var(--rot, 360deg));
            }
        }

        @media (max-width: 600px) {
            .modal-box { padding: 2rem 1.5rem; }
            .modal-input-group input { width: 76px; height: 76px; font-size: 2.8rem; }
            .float-heart { font-size: clamp(12px, 3vw, 22px); }
            .confetti-piece { font-size: clamp(12px, 3.5vw, 24px); }
        }

        @media (max-width: 400px) {
            .modal-input-group input { width: 60px; height: 60px; font-size: 2.2rem; border-radius: 20px; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ===== ARKA PLAN ===== -->
    <div class="stars" id="starsContainer"></div>
    <div class="ambient-orb ambient-orb--1"></div>
    <div class="ambient-orb ambient-orb--2"></div>
    <div class="ambient-orb ambient-orb--3"></div>

    <!-- ===== UÇAN KALPLER ===== -->
    <div class="floating-hearts" id="floatingHearts"></div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h2>✦ bir harf seç</h2>
            <p>Kalbin tam ortasında parlayacak özel harfi gir</p>
            <div class="modal-input-group">
                <input type="text" id="letterInput" maxlength="1" placeholder="?" autofocus>
                <button class="btn-neon-modal" id="modalBtn">Işıltıyı Başlat</button>
            </div>
        </div>
    </div>

    <!-- ===== ANA İÇERİK ===== -->
    <div class="main-content" id="mainContent">
        <div class="heart-wrapper" id="heartWrapper">
            <canvas id="heartCanvas" width="700" height="700"></canvas>
            <div class="heart-letter" id="heartLetter">♥</div>
        </div>
    </div>

    <!-- ===== KONFETTİ ===== -->
    <div class="confetti-container" id="confettiContainer"></div>

    <script>
        (function() {
            'use strict';

            // =============================================
            // 1. YILDIZLAR
            // =============================================
            const starsContainer = document.getElementById('starsContainer');
            for (let i = 0; i < 140; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = 1.2 + Math.random() * 3;
                star.style.setProperty('--size', size + 'px');
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (4 + Math.random() * 8) + 's');
                star.style.animationDelay = Math.random() * 6 + 's';
                starsContainer.appendChild(star);
            }

            // =============================================
            // 2. UÇAN KALPLER (Az)
            // =============================================
            const floatingHearts = document.getElementById('floatingHearts');
            const heartEmojis = ['❤️', '💖', '💗', '💕', '💘'];

            for (let i = 0; i < 14; i++) {
                const el = document.createElement('div');
                el.className = 'float-heart';
                el.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.setProperty('--duration', (12 + Math.random() * 16) + 's');
                el.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
                el.style.animationDelay = (Math.random() * 16) + 's';
                const size = 16 + Math.random() * 26;
                el.style.fontSize = size + 'px';
                floatingHearts.appendChild(el);
            }

            // =============================================
            // 3. CANVAS KALP ÇİZİMİ
            // =============================================
            const canvas = document.getElementById('heartCanvas');
            const ctx = canvas.getContext('2d');
            const W = 700,
                H = 700;

            function getHeartPoints(t) {
                const scale = 22;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                return { x: x * scale + 350, y: -y * scale + 350 };
            }

            const totalPoints = 350;
            const heartPath = [];
            for (let i = 0; i <= totalPoints; i++) {
                const t = (i / totalPoints) * 2 * Math.PI;
                heartPath.push(getHeartPoints(t));
            }

            let drawProgress = 0;
            let isDrawing = false;
            let animId = null;
            let letter = '♥';
            let explosionInterval = null;

            function fillHeart() {
                ctx.beginPath();
                ctx.moveTo(heartPath[0].x, heartPath[0].y);
                for (let i = 1; i < heartPath.length; i++) {
                    ctx.lineTo(heartPath[i].x, heartPath[i].y);
                }
                ctx.closePath();

                const gradient = ctx.createRadialGradient(350, 350, 50, 350, 350, 300);
                gradient.addColorStop(0, 'rgba(255, 45, 139, 0.2)');
                gradient.addColorStop(0.5, 'rgba(180, 78, 255, 0.1)');
                gradient.addColorStop(1, 'rgba(255, 45, 139, 0.02)');
                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.shadowColor = 'rgba(255, 45, 139, 0.06)';
                ctx.shadowBlur = 40;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            function drawHeart(progress) {
                ctx.clearRect(0, 0, W, H);

                if (progress >= 0.95) {
                    fillHeart();
                }

                ctx.shadowColor = 'rgba(255, 45, 139, 0.15)';
                ctx.shadowBlur = 20;

                ctx.beginPath();
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                const gradient = ctx.createLinearGradient(0, 0, W, H);
                gradient.addColorStop(0, '#ff2d8b');
                gradient.addColorStop(0.5, '#b44eff');
                gradient.addColorStop(1, '#ff6ba6');
                ctx.strokeStyle = gradient;

                const drawCount = Math.floor(progress * heartPath.length);
                if (drawCount > 0) {
                    ctx.moveTo(heartPath[0].x, heartPath[0].y);
                    for (let i = 1; i < drawCount && i < heartPath.length; i++) {
                        ctx.lineTo(heartPath[i].x, heartPath[i].y);
                    }
                }
                ctx.stroke();

                ctx.shadowColor = 'rgba(180, 78, 255, 0.05)';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.lineWidth = 12;
                ctx.strokeStyle = 'rgba(180, 78, 255, 0.03)';
                if (drawCount > 0) {
                    ctx.moveTo(heartPath[0].x, heartPath[0].y);
                    for (let i = 1; i < drawCount && i < heartPath.length; i++) {
                        ctx.lineTo(heartPath[i].x, heartPath[i].y);
                    }
                }
                ctx.stroke();

                if (drawCount > 0 && drawCount < heartPath.length) {
                    const p = heartPath[drawCount - 1];
                    ctx.shadowColor = 'rgba(255, 45, 139, 0.7)';
                    ctx.shadowBlur = 30;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 5, 0, 2 * Math.PI);
                    ctx.fillStyle = '#ff2d8b';
                    ctx.fill();
                }

                ctx.shadowBlur = 0;
            }

            function animateDraw() {
                if (!isDrawing) return;

                drawProgress += 0.007;
                if (drawProgress >= 1) {
                    drawProgress = 1;
                    drawHeart(drawProgress);
                    isDrawing = false;

                    document.getElementById('heartWrapper').classList.add('beating');
                    startExplosionLoop();

                    const wrapper = document.getElementById('heartWrapper');
                    wrapper.style.filter = 'drop-shadow(0 0 120px rgba(255, 45, 139, 0.5))';
                    setTimeout(() => { wrapper.style.filter = ''; }, 1500);

                    const letterEl = document.getElementById('heartLetter');
                    letterEl.style.textShadow = '0 0 50px #ff2d8b, 0 0 100px #b44eff, 0 0 200px #ff2d8b';
                    setTimeout(() => { letterEl.style.textShadow = ''; }, 2000);

                    return;
                }
                drawHeart(drawProgress);
                animId = requestAnimationFrame(animateDraw);
            }

            function startDrawing() {
                if (animId) cancelAnimationFrame(animId);
                drawProgress = 0;
                isDrawing = true;
                animateDraw();
            }

            // =============================================
            // 4. PATLAMA - ULTRA HAFIF (Çok az parçacık)
            // =============================================
            const confettiContainer = document.getElementById('confettiContainer');
            const emojis = ['❤️', '💖', '💗', '💕', '🌸', '🌺', '🌹'];

            function createExplosion(fromCenter = false) {
                const count = 25 + Math.floor(Math.random() * 20); // Çok azaltıldı
                const heartRect = document.getElementById('heartWrapper').getBoundingClientRect();
                const cx = heartRect.left + heartRect.width / 2;
                const cy = heartRect.top + heartRect.height / 2;

                for (let i = 0; i < count; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';

                    const rnd = Math.random();
                    let content;
                    if (rnd < 0.3) content = letter;
                    else if (rnd < 0.6) content = emojis[Math.floor(Math.random() * emojis.length)];
                    else if (rnd < 0.8) content = '🌸';
                    else content = '❤️';
                    piece.textContent = content;

                    const size = 14 + Math.random() * 24;
                    piece.style.fontSize = size + 'px';

                    let originX, originY;
                    if (fromCenter || Math.random() < 0.2) {
                        originX = (cx / window.innerWidth) * 100;
                        originY = (cy / window.innerHeight) * 100;
                    } else {
                        const angle = Math.random() * 2 * Math.PI;
                        const radius = (heartRect.width / 2) * (0.5 + Math.random() * 0.5);
                        const px = cx + Math.cos(angle) * radius;
                        const py = cy + Math.sin(angle) * radius;
                        originX = (px / window.innerWidth) * 100;
                        originY = (py / window.innerHeight) * 100;
                    }

                    const angle2 = Math.random() * 2 * Math.PI;
                    const distance = 60 + Math.random() * 250;
                    const tx1 = Math.cos(angle2) * (15 + Math.random() * 40);
                    const ty1 = Math.sin(angle2) * (15 + Math.random() * 40) - 30;
                    const tx2 = Math.cos(angle2) * distance * (0.3 + Math.random() * 0.4);
                    const ty2 = Math.sin(angle2) * distance * (0.3 + Math.random() * 0.4) - 50;

                    piece.style.left = originX + '%';
                    piece.style.top = originY + '%';
                    piece.style.setProperty('--tx1', tx1 + 'px');
                    piece.style.setProperty('--ty1', ty1 + 'px');
                    piece.style.setProperty('--tx2', tx2 + 'px');
                    piece.style.setProperty('--ty2', ty2 + 'px');
                    piece.style.setProperty('--r1', (Math.random() * 360) + 'deg');
                    piece.style.setProperty('--r2', (Math.random() * 360) + 'deg');
                    piece.style.setProperty('--duration', (1.4 + Math.random() * 1.2) + 's');
                    piece.style.animationDelay = (Math.random() * 0.15) + 's';

                    confettiContainer.appendChild(piece);
                    setTimeout(() => {
                        if (piece.parentNode) piece.remove();
                    }, 3000);
                }
            }

            function startExplosionLoop() {
                if (explosionInterval) clearInterval(explosionInterval);

                // İlk patlama
                setTimeout(() => {
                    createExplosion(true);
                    createExplosion(false);
                }, 300);

                // Daha seyrek (4 saniyede bir)
                explosionInterval = setInterval(() => {
                    createExplosion(Math.random() < 0.3);
                }, 4000);

                // 5 saniye sonra ekstra
                setTimeout(() => {
                    createExplosion(true);
                    createExplosion(false);
                }, 5000);
            }

            // =============================================
            // 5. MODAL MANTIĞI
            // =============================================
            const modalOverlay = document.getElementById('modalOverlay');
            const letterInput = document.getElementById('letterInput');
            const modalBtn = document.getElementById('modalBtn');
            const mainContent = document.getElementById('mainContent');
            const heartLetter = document.getElementById('heartLetter');

            function openMain(inputLetter) {
                letter = inputLetter.toUpperCase() || '♥';
                heartLetter.textContent = letter;

                mainContent.classList.add('visible');
                modalOverlay.classList.add('hidden');
                letterInput.value = '';

                setTimeout(() => {
                    startDrawing();
                }, 400);
            }

            function handleSubmit() {
                let val = letterInput.value.trim();
                if (val.length === 0) {
                    openMain('♥');
                    return;
                }
                openMain(val.charAt(0));
            }

            modalBtn.addEventListener('click', handleSubmit);
            letterInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSubmit();
                }
            });

            letterInput.addEventListener('input', function() {
                if (this.value.length > 1) this.value = this.value.slice(0, 1);
                this.value = this.value.toUpperCase();
            });

            // =============================================
            // 6. KALBE TIKLAYINCA
            // =============================================
            document.getElementById('heartWrapper').addEventListener('click', function(e) {
                createExplosion(true);
                createExplosion(false);

                this.style.animationDuration = '0.6s';
                setTimeout(() => { this.style.animationDuration = ''; }, 800);
                this.style.filter = 'drop-shadow(0 0 120px rgba(255, 45, 139, 0.5))';
                setTimeout(() => { this.style.filter = ''; }, 600);

                const letterEl = document.getElementById('heartLetter');
                letterEl.style.textShadow = '0 0 50px #ff2d8b, 0 0 100px #b44eff, 0 0 200px #ff2d8b';
                setTimeout(() => { letterEl.style.textShadow = ''; }, 800);
            });

            // =============================================
            // 7. ODAK
            // =============================================
            letterInput.focus();

            console.log('💖 Ultra hafif patlama · Hiç kasma yok!');
        })();
    </script>
